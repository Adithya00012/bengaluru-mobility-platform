version: 2

sources:
  - name: mobility_raw
    schema: main
    tables:
      - name: fact_trips
        columns:
          - name: trip_id
            tests:
              - unique
              - not_null
          - name: fare
            tests:
              - not_null
      - name: fact_traffic
        columns:
          - name: congestion_index
            tests:
              - not_null
      - name: dim_date
      - name: dim_time
      - name: dim_location
      - name: dim_weather