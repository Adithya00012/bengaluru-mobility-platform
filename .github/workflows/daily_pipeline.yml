name: Daily Mobility Pipeline

on:
  schedule:
    - cron: '0 3 * * *'  
  workflow_dispatch:      

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install pandas numpy dbt-core==1.11.15 dbt-sqlite==1.10.0

      - name: Run the data pipeline
        run: python3 src/run_pipeline.py

      - name: Run dbt models
        working-directory: bengaluru_mobility_dbt
        run: |
          dbt run
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt

      - name: Run dbt tests
        working-directory: bengaluru_mobility_dbt
        run: dbt test
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt

      - name: Pipeline summary
        if: always()
        run: |
          echo "## Pipeline Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Data ingestion: completed" >> $GITHUB_STEP_SUMMARY
          echo "- dbt models built: fact_trips_enriched, fact_traffic_enriched" >> $GITHUB_STEP_SUMMARY
          echo "- dbt tests run: 4 (uniqueness, not-null checks)" >> $GITHUB_STEP_SUMMARY
          echo "- Run completed at: $(date -u)" >> $GITHUB_STEP_SUMMARY